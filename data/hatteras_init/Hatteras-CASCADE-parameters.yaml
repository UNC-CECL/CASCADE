# DUNE CEILING (2026-10-20, Hannah and her advisor). Dmax = 10.5 m above the berm,
# so Dmaxel = BermEl 1.7 + 10.5 = 12.2 m NAVD88, one island-wide value, both
# periods (Barrier3D: Dmax = Dmaxel - BermEl). Near the tallest crest in the
# 1996 DEM (12.1 m), so the ceiling is the measured dune height and the growth
# rate (rmin/rmax 0-0.01, set in the runner) keeps dunes from growing too fast.
# With it the 1996 run's 2010 median crest is 5.46 m vs the 2009 lidar's 5.39 m;
# low dunes end ~1 m high; Isabel 43/48 domains. Do not pair this ceiling with
# fast growth: at 0.55-0.95 every dune grows to ~12 m and overwash stops. The ends
# were solved on the previous 5.5 m / 0.55-0.95 settings and need re-solving.
