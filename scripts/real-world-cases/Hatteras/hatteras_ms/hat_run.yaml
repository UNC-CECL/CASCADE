# Hatteras hindcast run settings, read by HAT_hindcast.ipynb and HAT_hindcast.py.
# Precedence: environment variable > this file > default in hindcast/HAT_hindcast_config.py.
# Unknown keys raise. HAT_run_matrix.py and the groin sweep ignore this file.
# The reasoning behind each value is in README.md and the git history.

# --- which run ---------------------------------------------------------------

# 1996 (1996-2009, calibration) or 2009 (2009-2025, test)
start_year: 1996

# zeroBE (none) | edgeBE (end domains only) | calibBE (per-domain fit)
source_sink: edgeBE

# natural | roadway_only | beachdune_only | full_management | full_no_fill (2009 only)
scenario: full_management

# --- the groin ---------------------------------------------------------------

groin:
  enabled: true
  # Share of arriving drift held back (0-1), per start year
  strength_1996: 0.16
  strength_2009: 0.16
  # Shares of GIS 6's loss taken from GIS 6, 7, 8; [1, 0, 0] is the plain groin
  spread_weights: [0, 2/3, 1/3]
  # strength: 0.25   # overrides both; needed for any other start year
  # First year the groin no longer works (2017 Buxton fill)
  end_year: 2017


# --- physics -----------------------------------------------------------------
# Off-default values add a `wave...` token to the run name. The edge ends were
# solved at these values; change one and they need re-solving.

physics:
  wave_height_Hs: 3.0           # m (2.0 before 2026-10-29)
  wave_period_s: 7.5            # s
  wave_asymmetry: 0.6           # fraction from the left of shore-normal
  wave_angle_high_fraction: 0.5 # fraction at more than 45 deg


# --- dune collision ----------------------------------------------------------
# Storms that reach a dune's toe but not its crest lower it (cascade/dune_collision.py).
# Toes and beach widths: input_prep/1-barrier3d-domains/3-dune-toes. Off earns a
# `nocollision` token in the run name.

dune_collision:
  enabled: true
  cs: 1.02e-4                 # Larson et al. (2004) impact coefficient: the dry-beach fit (2026-11-03), checked
                              # in-model (cal_g16_nocape_rd198_dry; 0.87e-4 no better). 1.24e-4 with the width to the crest
  beach_width_limit_m: 25     # no collision loss on a dry beach (beach start to toe) this wide or wider
                              # (45 m until 2026-11-03, when the width ran to the crest)


# --- management --------------------------------------------------------------
# NC-12 relocations (1989, 1999): null = follow scenario, true = force on, false = force off.
# Only 1999 falls in a period (1996-2009).
relocations: null

# Where a relocated road is rebuilt, m behind the dune (multiples of 10), or `measured`
relocation_setback_m: 20

# Road manager stops rebuilding dunes where the road is farther than this behind them, m
road_dune_rebuild_trigger_m: 20

# Village (beach/dune manager) dune cap, m NAVD88; obx-cascade's own is 5.7 (4 m above the berm)
village_dune_cap_navd88_m: 8.0

sandbags: false

# --- output (does not change the simulation) ---------------------------------

output:
  show_figures: null      # null: notebook True, .py False
  make_gifs: true
  save_model_state: true  # ~160 MB .npz
  # true EMPTIES an existing run directory and replaces its run_index row
  overwrite: false
